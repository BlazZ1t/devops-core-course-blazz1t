apiVersion: v1
kind: Pod
metadata:
  name: wait-demo
spec:
  initContainers:
    - name: wait-for-service
      image: busybox:1.36
      command:
        - sh
        - -c
        - until nslookup myservice; do echo waiting for service; sleep 2; done

  containers:
    - name: main
      image: nginx:stable